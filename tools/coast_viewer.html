<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #222; color: white; font-family: sans-serif; }
    .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
    .card { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
    canvas { width: 300px; height: 300px; background: #444; border-radius: 4px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const tiles = [
      'hex_coast_A.fbx',
      'hex_coast_B.fbx',
      'hex_coast_C.fbx',
      'hex_coast_D.fbx',
      'hex_coast_E.fbx'
    ];

    const loader = new FBXLoader();
    loader.setResourcePath('../kaykit_full/Textures/');

    tiles.forEach(file => {
      const card = document.createElement('div');
      card.className = 'card';
      const title = document.createElement('div');
      title.innerText = file;
      card.appendChild(title);

      const canvas = document.createElement('canvas');
      card.appendChild(canvas);
      document.getElementById('grid').appendChild(card);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(300, 300);

      camera.position.set(0, 3, 3);
      camera.lookAt(0, 0, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      loader.load(`../kaykit_full/Models/tiles/coast/${file}`, fbx => {
        scene.add(fbx);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>

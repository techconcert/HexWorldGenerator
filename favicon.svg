<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="hex-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.7" />
    </filter>

    <!-- Gradients -->
    <!-- Grass Top Face -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Dirt/Stone Skirt Left -->
    <linearGradient id="skirtLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#44403c" />
    </linearGradient>

    <!-- Dirt/Stone Skirt Right (Darker side) -->
    <linearGradient id="skirtRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Castle Front Light -->
    <linearGradient id="castleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Castle Side Shadow -->
    <linearGradient id="castleShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- River Water -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Royal Banner Red -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="9" fill="#090d16" opacity="0.35" />

  <!-- 3D Hex Tile Group -->
  <g filter="url(#hex-shadow)">
    <!-- Skirt Left Face -->
    <polygon points="30,88 64,104 64,120 30,104" fill="url(#skirtLeft)" />
    <!-- Skirt Right Face (Shaded) -->
    <polygon points="64,104 98,88 98,104 64,120" fill="url(#skirtRight)" />

    <!-- Stone/Strata Accent lines on skirt -->
    <path d="M 30,95 L 64,111 M 30,101 L 64,117" stroke="#292524" stroke-width="1.2" opacity="0.4" />
    <path d="M 64,111 L 98,95 M 64,117 L 98,101" stroke="#1c1917" stroke-width="1.2" opacity="0.5" />

    <!-- Hex Top Surface (Lush Grass) -->
    <polygon points="64,44 98,60 98,88 64,104 30,88 30,60" fill="url(#grassGrad)" stroke="#86efac" stroke-width="1.5" />

    <!-- River cutting across SE corner -->
    <path d="M 98,72 Q 82,78 74,99 L 84,101 Q 90,85 98,81 Z" fill="url(#waterGrad)" />
    <!-- River Foam highlight -->
    <path d="M 97,73 Q 83,79 76,98" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Mini stylized Pine Tree (Left sector) -->
    <!-- Tree Trunk -->
    <rect x="39" y="80" width="3" height="4" fill="#78350f" />
    <!-- Tree Foliage Cones -->
    <polygon points="40.5,71 34,79 47,79" fill="#14532d" />
    <polygon points="40.5,67 36,74 45,74" fill="#166534" />
    <polygon points="40.5,63 38,70 43,70" fill="#22c55e" />

    <!-- Road / Cobblestone trail from castle gate to SW -->
    <path d="M 60,84 Q 50,88 42,91" stroke="#d6d3d1" stroke-width="2.5" stroke-dasharray="2 1.5" fill="none" opacity="0.8" />
  </g>

  <!-- Medieval Castle Keep / Tower -->
  <!-- Tower Base Shadow on grass -->
  <ellipse cx="64" cy="74" rx="16" ry="5" fill="#14532d" opacity="0.5" />

  <!-- Tower Main Body -->
  <!-- Left Wall (Light) -->
  <polygon points="52,42 64,46 64,74 52,70" fill="url(#castleLight)" />
  <!-- Right Wall (Shadow) -->
  <polygon points="64,46 76,42 76,70 64,74" fill="url(#castleShadow)" />

  <!-- Corbel trim line under battlements -->
  <polyline points="50,42 64,46 78,42" stroke="#475569" stroke-width="1.5" fill="none" />

  <!-- Battlements / Crenellations -->
  <!-- Left Tower Battlements -->
  <polygon points="50,34 54,34 54,38 58,38 58,34 63,35 63,43 50,40" fill="url(#castleLight)" />
  <!-- Right Tower Battlements -->
  <polygon points="63,35 68,34 68,38 72,38 72,34 78,34 78,40 63,43" fill="url(#castleShadow)" />

  <!-- Merlon Caps (highlights) -->
  <line x1="50" y1="34" x2="54" y2="34" stroke="#ffffff" stroke-width="1.5" />
  <line x1="58" y1="34" x2="63" y2="35" stroke="#ffffff" stroke-width="1.5" />
  <line x1="68" y1="34" x2="72" y2="34" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="72" y1="34" x2="78" y2="34" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Tower Center Ridge line -->
  <line x1="64" y1="46" x2="64" y2="74" stroke="#64748b" stroke-width="1" />

  <!-- Arrow Slit Window (Left side) with torch glow -->
  <rect x="56" y="50" width="2" height="6" rx="1" fill="#f59e0b" filter="url(#glow)" />
  <rect x="56" y="50" width="2" height="6" rx="1" fill="#fef08a" />

  <!-- Arched Gate Entrance (Spanning center) -->
  <path d="M 60,73 L 60,63 Q 64,60 68,63 L 68,73 Z" fill="#1e293b" />
  <!-- Arched Stone Trim -->
  <path d="M 59,73 L 59,62.5 Q 64,59 69,62.5 L 69,73" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
  <!-- Warm Golden Glow inside Gate -->
  <ellipse cx="64" cy="69" rx="3" ry="4" fill="#fbbf24" opacity="0.85" filter="url(#glow)" />

  <!-- Royal Flagpole & Fluttering Pennant Banner -->
  <!-- Pole -->
  <line x1="64" y1="35" x2="64" y2="12" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />
  <!-- Golden Finial (spear tip / orb) -->
  <circle cx="64" cy="11" r="2.2" fill="url(#goldGrad)" />

  <!-- Flying Heraldic Swallowtail Banner -->
  <path d="M 64,13 Q 76,11 88,16 L 80,21 L 88,26 Q 74,22 64,23 Z" fill="url(#bannerGrad)" stroke="#f59e0b" stroke-width="0.8" />
  <!-- Heraldic Gold Emblem on Flag (Tiny Crown / Chevron) -->
  <path d="M 69,18 L 72,16 L 75,18 L 74,20 L 70,20 Z" fill="#fde047" />

  <!-- Decorative Sparkles / Floating Magic Particles -->
  <circle cx="94" cy="40" r="1.5" fill="#fbbf24" opacity="0.9" filter="url(#glow)" />
  <path d="M 94,36 L 94,44 M 90,40 L 98,40" stroke="#fef08a" stroke-width="0.8" />

  <circle cx="34" cy="50" r="1.2" fill="#67e8f9" opacity="0.8" />
  <path d="M 34,47 L 34,53 M 31,50 L 37,50" stroke="#bae6fd" stroke-width="0.6" />
</svg>
